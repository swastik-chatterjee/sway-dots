## foot: Wayland terminal. Colors and fonts live in their own files.
include=~/.config/foot/colors.ini
include=~/.config/foot/fonts.ini

initial-window-size-chars=110x32
initial-window-mode=windowed
pad=8x8
resize-delay-ms=100
term=foot

[scrollback]
lines=20000
multiplier=3.0

[url]
launch=xdg-open ${url}

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes
